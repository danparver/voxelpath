<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laberinto 3D</title>
  </head>
  <body>
    <section class="viewer-panel">
      <div id="app"></div>
      <div class="camera-toolbar" aria-label="Controles de cámara 3D">
        <button id="camera-top" type="button">VISTA TOP</button>
        <button id="camera-north" type="button">VISTA NORTE</button>
        <button id="camera-rotate" type="button">ROTAR 90°</button>
      </div>
    </section>
    <input id="map-file" type="file" accept="application/json,.json" hidden />
    <aside id="voxel-editor"></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
