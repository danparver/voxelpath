<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laberinto 3D</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="file-loader">
      <label for="map-file">Cargar mapa JSON</label>
      <input id="map-file" type="file" accept="application/json,.json" />
      <p id="file-status" aria-live="polite">Mapa de ejemplo cargado</p>
      <button id="camera-mode" type="button">Cambiar a Explore</button>
      <p id="camera-help">Orbit: arrastra para rotar y usa la rueda para acercar.</p>
    </div>
    <aside id="voxel-editor"></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
